name: news_task
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  internet_connection_checker_plus: ^3.1.1
  shared_preferences: ^2.5.5
  shared_preferences_android: ^2.4.27
  get_it: ^9.2.1
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  easy_localization: ^3.0.7+1
  intl: ^0.20.2
  # For Responsive UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  # For Logging in run
  talker: ^5.1.19
  talker_dio_logger: ^5.1.19
  talker_bloc_logger: ^5.1.19
  talker_flutter: ^5.1.19
  cached_network_image: ^3.4.1
  flutter_staggered_animations: ^1.1.1
  uuid: ^4.6.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  collection:
  motor: ^1.1.0
  material_shapes:
    path: packages/material_shapes
  expressive_loading_indicator:
    path: packages/expressive_loading_indicator
  expressive_snack:
    path: packages/expressive_snack
  expressive_refresh_indicator:
    path: packages/expressive_refresh_indicator
  expressive_sheet:
    path: packages/expressive_sheet


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.4
  fake_async: ^1.3.3
  mocktail: ^1.0.5

flutter:

  uses-material-design: true

  assets:
    - assets/translations/
    - assets/fonts/
    - assets/icons/
    - json_data/
    - json_data/articles/
    - json_data/bookmarks/
    - json_data/feed/
    - json_data/feed/topic/
    - json_data/reactions/
    - json_data/search/
    - json_data/sync/

  fonts:
    - family: AnthropicSansText
      fonts:
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-300.otf
          weight: 300
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-400.otf
          weight: 400
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-400-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-500.otf
          weight: 500
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-500-Italic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-600.otf
          weight: 600
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-700.otf
          weight: 700
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-700-Italic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-800.otf
          weight: 800
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-800-Italic.otf
          weight: 800
          style: italic

    - family: AnthropicSansDisplay
      fonts:
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-300.otf
          weight: 300
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-400.otf
          weight: 400
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-400-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-500.otf
          weight: 500
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-500-Italic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-600.otf
          weight: 600
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-700.otf
          weight: 700
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-700-Italic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-800.otf
          weight: 800
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-800-Italic.otf
          weight: 800
          style: italic

    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-600.ttf
          weight: 600

    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900